name: Automated Vertical Physics Shorts Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  preflight:
    name: Pre-flight CSV & Schema Validation
    runs-on: ubuntu-latest
    outputs:
      job_count: ${{ steps.validate.outputs.job_count }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate CSV & JSON Specs
        id: validate
        run: |
          python schema_validator.py content_batch.csv
          COUNT=$(python -c "import csv; print(len(list(csv.reader(open('content_batch.csv'))))-1)")
          echo "job_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "### Pre-flight Checklist Passed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated $COUNT physics short specifications." >> "$GITHUB_STEP_SUMMARY"

  render:
    name: Parallel Render Worker
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [0, 1, 2, 3]
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg texlive-latex-recommended texlive-plain-generic dvisvgm libpango1.0-dev pkg-config libcairo2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade "pip<24.1"
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Cache XTTS Model Weights
        uses: actions/cache@v4
        with:
          path: ~/.local/share/tts
          key: ${{ runner.os }}-tts-xtts-v2

      - name: Execute Parallel Shard Batch
        run: |
          python batch_runner.py --shard-index ${{ matrix.worker }} --shard-total 4 --output_dir dist

      - name: Upload Runner Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: physics-shorts-worker-${{ matrix.worker }}
          path: dist/*.mp4
          retention-days: 7

  bundle:
    name: Aggregate & Publish Artifacts
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Download All Parallel Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: physics-shorts-complete-bundle
          pattern: physics-shorts-worker-*
          delete-merged: true
